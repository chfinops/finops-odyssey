<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FinOps Odyssey · Live Leaderboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="/_vercel/insights/script.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@700;900&family=Inter:wght@400;500;600&display=swap');

  :root {
    --ch-orange: #FF6B1A;
    --ch-blue: #1E88E5;
    --nasa-red: #FC3D21;
    --nasa-blue: #0B3D91;
    --gold: #FFB300;
    --silver: #C0C8D5;
    --bronze: #CD7F32;
    --cyan: #00E5FF;
    --green: #39FF14;
    --bg: #020409;
    --bg2: #0a1428;
    --bg3: #0d1f3c;
    --star: #F0F4FF;
    --muted: rgba(200,216,232,0.6);
    --border: rgba(0,229,255,0.25);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--bg);
    color: var(--star);
    font-family: 'Orbitron', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body {
    background:
      radial-gradient(ellipse at 50% 0%, rgba(11,61,145,0.45) 0%, transparent 55%),
      radial-gradient(ellipse at 80% 100%, rgba(255,107,26,0.15) 0%, transparent 50%),
      var(--bg);
    padding: 40px 60px 80px;
  }

  /* Subtle starfield via fixed pseudo-element */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      radial-gradient(1px 1px at 13% 22%, var(--star) 50%, transparent 50%),
      radial-gradient(1px 1px at 27% 71%, var(--star) 50%, transparent 50%),
      radial-gradient(1px 1px at 41% 9%, var(--star) 50%, transparent 50%),
      radial-gradient(1px 1px at 56% 53%, var(--star) 50%, transparent 50%),
      radial-gradient(1px 1px at 68% 38%, var(--star) 50%, transparent 50%),
      radial-gradient(1px 1px at 79% 85%, var(--star) 50%, transparent 50%),
      radial-gradient(1px 1px at 91% 17%, var(--star) 50%, transparent 50%),
      radial-gradient(2px 2px at 8% 60%, var(--star) 50%, transparent 50%),
      radial-gradient(2px 2px at 64% 12%, var(--star) 50%, transparent 50%);
    background-size: 100% 100%;
    opacity: 0.55;
    pointer-events: none;
    z-index: 0;
  }

  .wrap { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 36px;
    padding-bottom: 24px;
    border-bottom: 2px solid var(--border);
  }
  .brand {
    font-family: 'Press Start 2P', monospace;
    font-size: 34px;
    line-height: 1.4;
    color: var(--ch-orange);
    text-shadow: 0 0 20px rgba(255,107,26,0.4);
  }
  .brand .sub {
    display: block;
    font-size: 14px;
    color: var(--cyan);
    margin-top: 12px;
    letter-spacing: 2px;
  }
  .live-tag {
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    padding: 12px 20px;
    border: 2px solid;
    border-radius: 4px;
    animation: pulse 2s ease-in-out infinite;
    transition: color 0.3s, border-color 0.3s, background 0.3s;
  }
  .live-tag.live {
    color: var(--green);
    border-color: var(--green);
    background: rgba(57,255,20,0.08);
    text-shadow: 0 0 8px rgba(57,255,20,0.6);
  }
  .live-tag.stale {
    color: var(--nasa-red);
    border-color: var(--nasa-red);
    background: rgba(252,61,33,0.12);
    text-shadow: 0 0 8px rgba(252,61,33,0.6);
    animation: pulse 0.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* ── Leaderboard rows ── */
  .lb-header, .lb-row {
    display: grid;
    grid-template-columns: 90px 1fr 220px 130px 130px;
    gap: 24px;
    align-items: center;
    padding: 18px 24px;
    border-radius: 8px;
  }
  .lb-header {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    color: var(--cyan);
    letter-spacing: 1.5px;
    margin-bottom: 12px;
    border-bottom: 1px dashed var(--border);
    padding-bottom: 16px;
    border-radius: 0;
  }
  .lb-row {
    background: linear-gradient(90deg, rgba(11,61,145,0.18), rgba(11,61,145,0.05));
    border: 1px solid var(--border);
    margin-bottom: 10px;
    font-weight: 700;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .lb-row:hover { transform: translateX(4px); }

  .rank {
    font-family: 'Press Start 2P', monospace;
    font-size: 22px;
    text-align: center;
  }
  .nick {
    font-family: 'Orbitron', sans-serif;
    font-size: 28px;
    font-weight: 900;
    color: var(--star);
    letter-spacing: 1px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .score {
    font-family: 'Press Start 2P', monospace;
    font-size: 22px;
    color: var(--green);
    text-align: right;
    text-shadow: 0 0 8px rgba(57,255,20,0.4);
  }
  .meta {
    font-size: 18px;
    color: var(--muted);
    text-align: center;
    font-weight: 600;
  }

  /* Rank-specific styling */
  .lb-row.rank-1 {
    background: linear-gradient(90deg, rgba(255,179,0,0.22), rgba(255,179,0,0.06));
    border: 2px solid var(--gold);
    box-shadow: 0 0 30px rgba(255,179,0,0.25);
  }
  .lb-row.rank-1 .rank { color: var(--gold); font-size: 26px; }
  .lb-row.rank-1 .nick { color: var(--gold); font-size: 32px; }
  .lb-row.rank-1 .score { color: var(--gold); font-size: 26px; text-shadow: 0 0 12px rgba(255,179,0,0.6); }

  .lb-row.rank-2 { border-color: var(--silver); }
  .lb-row.rank-2 .rank { color: var(--silver); }

  .lb-row.rank-3 { border-color: var(--bronze); }
  .lb-row.rank-3 .rank { color: var(--bronze); }

  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
    font-size: 20px;
  }

  /* ── Footer ── */
  .footer {
    position: fixed;
    bottom: 16px;
    right: 24px;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: var(--muted);
    z-index: 2;
  }
  .footer .dot { color: var(--green); animation: pulse 2s ease-in-out infinite; }

  /* ── Responsive: phones / tablets ── */
  @media (max-width: 1024px) {
    body { padding: 24px 24px 60px; }
    .brand { font-size: 22px; }
    .brand .sub { font-size: 11px; }
    .lb-header, .lb-row { grid-template-columns: 60px 1fr 140px; gap: 12px; padding: 14px 16px; }
    .lb-header .col-phase, .lb-header .col-eff,
    .lb-row .col-phase, .lb-row .col-eff { display: none; }
    .nick { font-size: 20px; }
    .lb-row.rank-1 .nick { font-size: 22px; }
    .score { font-size: 16px; }
    .lb-row.rank-1 .score { font-size: 18px; }
    .rank { font-size: 16px; }
    .lb-row.rank-1 .rank { font-size: 18px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        🚀 FINOPS ODYSSEY
        <span class="sub">QUEST FOR LUNAR SAVINGS · LIVE LEADERBOARD</span>
      </div>
      <div id="live-tag" class="live-tag live">● LIVE</div>
    </header>

    <div class="lb-header">
      <div class="rank">RANK</div>
      <div>PILOT</div>
      <div class="score" style="text-align:right">SCORE</div>
      <div class="meta col-phase">PHASE</div>
      <div class="meta col-eff">EFFICIENCY</div>
    </div>

    <div id="lb-rows">
      <div class="empty">Loading leaderboard…</div>
    </div>
  </div>

  <div class="footer">UPDATED <span id="ts">--:--:--</span> <span class="dot">●</span> AUTO-REFRESH 10S</div>

<script>
'use strict';

const SUPABASE_URL = 'https://bruyhlosyllqciutlujx.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_9EWwL61RLG563gDGv49iNQ_9BFPSp3U';
// No login on this page — but disable persistSession so this tab can never
// inadvertently inherit/clobber an admin session in another tab.
const db = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
  auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
});

let lastSuccess = null;
const REFRESH_MS = 10000;
const STALE_AFTER_MS = 30000; // mark badge red if no successful fetch in 30s

function escHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function rankBadge(i) {
  if (i === 0) return '🥇';
  if (i === 1) return '🥈';
  if (i === 2) return '🥉';
  return '#' + (i + 1);
}

function setLiveBadge(state, msg) {
  const tag = document.getElementById('live-tag');
  if (!tag) return;
  tag.className = 'live-tag ' + state;
  tag.textContent = msg;
}

function checkStale() {
  if (!lastSuccess) return;
  const ageMs = Date.now() - lastSuccess;
  if (ageMs > STALE_AFTER_MS) {
    const mins = Math.floor(ageMs / 60000);
    const secs = Math.floor((ageMs % 60000) / 1000);
    const ago = mins > 0 ? `${mins}m${secs}s` : `${secs}s`;
    setLiveBadge('stale', `● STALE · ${ago}`);
  }
}

async function loadLeaderboard() {
  const container = document.getElementById('lb-rows');

  let data, error;
  try {
    const res = await db
      .from('scores')
      .select('nickname, score, phase_reached, efficiency')
      .eq('removed', false)
      .order('score', { ascending: false })
      .limit(10);
    data = res.data; error = res.error;
  } catch (e) {
    error = e;
  }

  if (error) {
    // Don't wipe the existing rows — keep last good state visible, just mark stale
    setLiveBadge('stale', '● CONNECTION ERROR');
    console.error('[lb] fetch failed', error);
    return;
  }

  lastSuccess = Date.now();
  setLiveBadge('live', '● LIVE');

  if (!data?.length) {
    container.innerHTML = '<div class="empty">No scores yet — be the first pilot to land on the moon.</div>';
  } else {
    container.innerHTML = data.map((row, i) => `
      <div class="lb-row rank-${i + 1}">
        <div class="rank">${rankBadge(i)}</div>
        <div class="nick">${escHtml(row.nickname)}</div>
        <div class="score">${row.score.toLocaleString()}</div>
        <div class="meta col-phase">${row.phase_reached || '—'}/3</div>
        <div class="meta col-eff">${row.efficiency ?? '—'}%</div>
      </div>
    `).join('');
  }

  document.getElementById('ts').textContent = new Date().toLocaleTimeString([], { hour12: false });
}

loadLeaderboard();
setInterval(loadLeaderboard, REFRESH_MS);
// Check staleness every 5s independently of fetch interval — so the badge
// flips red even if the fetch promise hangs (network blip, browser sleep, etc.)
setInterval(checkStale, 5000);

// When tab becomes visible after backgrounding (browsers throttle setInterval
// in hidden tabs), refresh immediately to catch up.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) loadLeaderboard();
});
</script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
